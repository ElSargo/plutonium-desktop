# xdg-desktop-portal's choice of backends with XDG_CURRENT_DESKTOP=Plutonium:
# screen capture, screenshots, global shortcuts, file pickers and printing
# from the helper (plutoniumd; printing as plutonium-print, its
# printportal.py), the rest from the GTK backend (docs/features/CAPTURE.md, "The
# portal backend").
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=plutonium
org.freedesktop.impl.portal.Screenshot=plutonium
org.freedesktop.impl.portal.GlobalShortcuts=plutonium
org.freedesktop.impl.portal.FileChooser=plutonium
org.freedesktop.impl.portal.Print=plutonium-print
