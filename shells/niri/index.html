<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>niri</title>
<!--
  A niri clone as a Plutonium frontend: scrollable tiling on the substrate
  (navigator.windowBroker, <native-window>, browser tabs and the helper's shell
  library), with niri's default binds and look.

  - Each workspace is an infinite horizontal strip of columns; a column holds
    one or more windows stacked vertically (or tabbed). New windows open as a
    new column right of the focused one, and the view scrolls to keep the
    focused column on screen.
  - Workspaces are dynamic and stacked vertically: there is always one empty
    workspace at the bottom, and empty ones disappear once you leave them.
  - The overview (Super+O, or the top-left hot corner: the desktop's, with
    several displays) zooms out to every workspace. Click a window to go to
    it, drag one to another workspace, into a column or onto a tab, or
    between two workspaces for a new one.
  - Super+drag (or the app's own title bar) moves a window: it leaves the
    layout and goes where it's dropped, shown by niri's insert hint: a new
    column (the sides of a column, or the gap), into a column (the top or
    bottom of a window), or a tab (the middle of a window; any of a tabbed
    column). Near a screen edge the view scrolls along.
  - niri's touchpad swipes follow the fingers and snap at the end: Chromium
    gives the page no three-finger gestures, so a two-finger scroll with
    Super held (any in the overview) is the swipe. Super+middle-drag, and a
    drag on a workspace in the overview, drag the view the same way.
  - The bar's minimap (minimap.js) shows the workspaces and the focused
    one's columns, with app icons.
  - Super+Shift+/ lists the binds (also shown at startup).

  Windows and tabs are the shell's when tagged niri:desktop: everything
  launched from here, plus windows nobody claims. Others (another shell's)
  come in through the browser's Super+Tab overlay. The layout is kept in
  this page's storage. Window ids restart with Ash, so a restart starts over.

  Several displays: the browser runs a niri page on each, and each is one of
  niri's outputs, with its own workspaces (and its own layout in storage, by
  the page's ?display=). An item is on the output whose tag it carries
  (niri:output/<display id>); new ones, and ones whose display went away, go
  to the focused display's. The browser's Super+Shift+Left/Right focus the
  monitor to the left or right, and Super+Ctrl+Shift+Left/Right move the
  focused window there. A window or tab dropped here from another shell
  joins this output. A window another page took (another display's shell
  shows it) leaves a placeholder; focusing it brings the window back.

  The browser keeps Super+F (fullscreen), Super+Tab (shells) and Super+Escape
  (release the pointer), so niri's Super+F (maximize column) is Super+M here,
  and Super+Shift+F is fullscreen as in niri. Print, Ctrl+Print and
  Alt+Print take screenshots as in niri; Super+Shift+S, Super+Ctrl+Shift+S
  and Super+Alt+Shift+S do the same on keyboards without a Print key. The
  helper is
  http://127.0.0.1:3780 unless the page URL says ?helper=<origin>.
-->
<style>
  :root {
    --anim: 280ms cubic-bezier(.25, 1, .5, 1);
    --text: #e6e6e6; --muted: #9a9a9a; --panel: #1e1e1e; --line: #3a3a3a;
    color-scheme: dark;
    /* Chrome's context menus, drawn by the shell library: like the popups below. */
    --plutonium-menu-bg: #1e1e1eee; --plutonium-menu-fg: var(--text);
    --plutonium-menu-border: 1px solid #ffffff1a; --plutonium-menu-radius: 10px;
    --plutonium-menu-shadow: 0 10px 40px #000a; --plutonium-menu-backdrop: blur(12px);
    --plutonium-menu-hover-bg: #7fc8ff2a; --plutonium-menu-hover-fg: var(--text);
    --plutonium-menu-separator: #ffffff14;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: #101012; color: var(--text); font: 13px/1.4 system-ui, sans-serif; user-select: none; }

  /* The wallpaper stays put while workspaces slide, as with swaybg under niri. */
  #wallpaper {
    position: fixed; inset: 0;
    background:
      radial-gradient(120% 90% at 85% 110%, #3b2a5c 0%, transparent 55%),
      radial-gradient(90% 80% at 10% -10%, #1f4a5e 0%, transparent 55%),
      linear-gradient(160deg, #15171c, #1c1d26 60%, #17151d);
  }
  /* The overview's backdrop. */
  #backdrop { position: fixed; inset: 0; background: #262626; opacity: 0; transition: opacity var(--anim); }
  body.overview #backdrop { opacity: 1; }

  #world { position: fixed; inset: 0; transform-origin: 50% 50%; transition: transform var(--anim); }
  body.noanim #world, body.noanim .tile, body.noanim .wscard, body.noanim .tabind { transition: none !important; }

  /* Each workspace's card: invisible in normal mode, a mini screen in the overview. */
  .wscard {
    position: absolute; left: 0; top: 0; border-radius: 0; opacity: 0; pointer-events: none;
    transition: transform var(--anim), opacity var(--anim), border-radius var(--anim);
    background:
      radial-gradient(120% 90% at 85% 110%, #3b2a5c 0%, transparent 55%),
      radial-gradient(90% 80% at 10% -10%, #1f4a5e 0%, transparent 55%),
      linear-gradient(160deg, #15171c, #1c1d26 60%, #17151d);
  }
  body.overview .wscard { opacity: 1; pointer-events: auto; border-radius: 24px; box-shadow: 0 10px 60px 10px #0008; }
  body.overview .wscard.current { outline: 6px solid #ffffff22; outline-offset: 6px; }

  .tile {
    position: absolute; left: 0; top: 0; z-index: 1;
    transition: transform var(--anim), width var(--anim), height var(--anim), opacity 150ms;
    overflow: hidden; background: transparent;
  }
  .tile.floating { z-index: 2; }
  .tile.dragging { z-index: 3; transition: none; opacity: .85; }
  .tile.hidden { visibility: hidden; }
  .tile.taken::before {
    content: "Shown on another display. Focus it to bring it back.";
    position: absolute; inset: 0; display: grid; place-items: center; padding: 1em; text-align: center;
    color: var(--muted); background: var(--panel); font: 13px system-ui, sans-serif;
  }
  .tile > native-window, .tile > embed {
    display: block; position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
  }
  /* A window is sized to where its tile ends up (the app resizes once) and
     scaled to follow the tile as it animates, as niri does: see placeTile(). */
  .tile > native-window { right: auto; bottom: auto; transform-origin: 0 0; }
  /* Above the window: takes the pointer in the overview and while Super is held. */
  .tile > .hit { position: absolute; inset: 0; pointer-events: none; }
  body.overview .tile > .hit, body.mod .tile > .hit { pointer-events: auto; cursor: grab; }
  body.overview .tile > .hit:hover { background: #ffffff10; }
  .tile.dragging > .hit { cursor: grabbing; }
  .tile > .placeholder {
    position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted);
    background: #1a1a1a; font-size: 12px;
  }
  .tile > .tabdialog {
    position: absolute; left: 50%; top: 16px; transform: translateX(-50%); width: min(420px, 90%);
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
    display: grid; gap: 8px; box-shadow: 0 6px 24px #0008; user-select: text;
  }
  .tabdialog p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .tabdialog div { display: flex; gap: 6px; justify-content: end; }

  /* Tab indicator of a tabbed column, in the gap to its left. */
  .tabind {
    position: absolute; left: 0; top: 0; display: flex; flex-direction: column; gap: 4px; z-index: 1;
    transition: transform var(--anim);
  }
  /* Clickable, as niri's: a wider hit area than the bar it draws. */
  .tabind span { flex: 1; border-radius: 5px; background: #505050; background-clip: content-box; padding: 0 3px; cursor: pointer; }
  .tabind span.active { background: var(--focus); }

  .hot-corner { position: fixed; width: 2px; height: 2px; z-index: 50; }
  .hot-corner[data-corner^="top"] { top: 0; } .hot-corner[data-corner^="bottom"] { bottom: 0; }
  .hot-corner[data-corner$="Left"] { left: 0; } .hot-corner[data-corner$="Right"] { right: 0; }

  /* Where a moved window goes (niri's insert hint). */
  #insert-hint {
    position: absolute; left: 0; top: 0; z-index: 2; border-radius: 8px; pointer-events: none;
    background: var(--hint); opacity: 0; transition: opacity 150ms;
  }
  #insert-hint.shown { opacity: 1; transition: opacity 150ms, transform 150ms, width 150ms, height 150ms; }
  #insert-hint.tab { background: transparent; outline: 4px solid var(--hint); outline-offset: -4px; }
  #insert-hint.tab::after {
    content: "Tab"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    padding: 4px 12px; border-radius: 8px; background: var(--hint); color: #fff; font-weight: 600;
  }

  /* Popups: launcher, hotkey overlay, notices. */
  .modal {
    position: fixed; z-index: 60; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: #1e1e1eee; border: 1px solid #ffffff1a; border-radius: 14px; box-shadow: 0 16px 60px #000a;
    backdrop-filter: blur(12px);
  }
  .modal[hidden] { display: none; }
  #launcher { top: 22%; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); padding: 10px; }
  #launcher input {
    width: 100%; font: 15px system-ui, sans-serif; padding: 10px 12px; border-radius: 9px;
    border: 1px solid #ffffff1f; background: #111; color: var(--text); outline: none;
  }
  #launcher ul { list-style: none; margin: 8px 0 0; padding: 0; max-height: 50vh; overflow-y: auto; }
  #launcher li { display: flex; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 8px; cursor: default; }
  #launcher li.selected { background: #7fc8ff2a; }
  #launcher li img, #launcher li .noicon { width: 24px; height: 24px; flex: none; }
  #launcher li .noicon { border-radius: 6px; background: #ffffff14; display: grid; place-items: center; font-size: 11px; color: var(--muted); }
  #launcher li small { color: var(--muted); margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
  #hotkeys { padding: 18px 22px; max-width: calc(100vw - 32px); max-height: calc(100vh - 32px); overflow: auto; }
  #hotkeys h2 { margin: 0 0 12px; font-size: 16px; font-weight: 600; text-align: center; }
  #hotkeys table { border-collapse: collapse; }
  #hotkeys td { padding: 3px 10px; white-space: nowrap; }
  #hotkeys td:first-child { text-align: right; }
  #hotkeys kbd {
    font: 12px ui-monospace, monospace; background: #ffffff14; border: 1px solid #ffffff22;
    border-radius: 5px; padding: 1px 6px;
  }
  #notice {
    position: fixed; z-index: 70; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #2b2b2bee; border: 1px solid #ffffff1a; border-radius: 10px; padding: 8px 14px;
    box-shadow: 0 6px 30px #0008; transition: opacity 200ms; opacity: 0; pointer-events: none;
  }
  #notice.shown { opacity: 1; }
  #empty-hint {
    position: fixed; inset: 0; display: grid; place-items: center; color: #ffffff40; font-size: 14px;
    pointer-events: none; text-align: center; transition: opacity var(--anim);
  }
  #empty-hint[hidden] { display: none; }
  body.overview #empty-hint { opacity: 0; }
  button {
    font: inherit; color: inherit; background: #ffffff14; border: 1px solid #ffffff1f; border-radius: 7px;
    padding: 4px 10px; cursor: pointer;
  }
</style>
</head>
<body class="noanim">
<div id="wallpaper"></div>
<div id="backdrop"></div>
<div id="world"><div id="insert-hint"></div></div>
<div id="empty-hint" hidden></div>
<div class="hot-corner" data-corner="topLeft"></div>
<div class="hot-corner" data-corner="topRight"></div>
<div class="hot-corner" data-corner="bottomLeft"></div>
<div class="hot-corner" data-corner="bottomRight"></div>
<div id="launcher" class="modal" hidden>
  <input id="launcher-input" spellcheck="false" placeholder="Run an app, a command, or open a web address">
  <ul id="launcher-list"></ul>
</div>
<div id="hotkeys" class="modal" hidden></div>
<div id="notice"></div>
<script type="module">
// niri's knobs, with its defaults where it has them (niri's config is KDL;
// these are the same options). Border on, focus ring off, shadows on and
// 12 px corners give the usual "rounded, bordered, shadowed" niri look.
const CONFIG = {
  gaps: 16,
  cornerRadius: 12,
  focusRing: { on: false, width: 4, active: "#7fc8ff", inactive: "#505050" },
  border: { on: true, width: 4, active: "#7fc8ff", inactive: "#505050" },
  shadow: { on: true, softness: 30, spread: 5, offsetX: 0, offsetY: 5, color: "#0007" },
  presetColumnWidths: [1 / 3, 1 / 2, 2 / 3],
  presetWindowHeights: [1 / 3, 1 / 2, 2 / 3],
  defaultColumnWidth: 1 / 2,
  // "never": scroll just enough to show the focused column; "always": center it;
  // "on-overflow": center it when it and the previous one don't both fit.
  centerFocusedColumn: "never",
  overviewZoom: 0.5,
  // gestures { hot-corners { … } }: which corners of the desktop open the overview.
  hotCorners: { topLeft: true, topRight: false, bottomLeft: false, bottomRight: false },
  // gestures { dnd-edge-view-scroll } and { dnd-edge-workspace-switch } (the latter in the
  // overview): while moving a window or dragging something, near an edge.
  dndEdgeViewScroll: { triggerWidth: 30, delayMs: 100, maxSpeed: 1500 },
  dndEdgeWorkspaceSwitch: { triggerHeight: 50, delayMs: 100, maxSpeed: 1500 },
  insertHint: { on: true, color: "#7fc8ff80" },
  hotkeyOverlayAtStartup: true,
  terminal: ["foot"],
};
// Everything this shell shows carries this tag (it's also the thread apps launch in).
const TAG = "niri:desktop";

const params = new URLSearchParams(location.search);
const helper = params.get("helper") ?? "http://127.0.0.1:3780";
// Several displays: this page's output (see the comment at the top).
const OUTPUT_PREFIX = "niri:output/";
const LAYOUT_KEY = params.get("display") ? `niri-shell.layout.${params.get("display")}` : "niri-shell.layout";
const $ = (id) => document.getElementById(id);
const g = CONFIG.gaps;
// The shell's animation (--anim), for animations run from script.
const ANIM = (() => {
  const v = getComputedStyle(document.documentElement).getPropertyValue("--anim").trim();
  const m = /^(\d+(?:\.\d+)?)ms\s+(.*)$/.exec(v);
  return m ? { ms: Number(m[1]), easing: m[2] } : { ms: 280, easing: "ease-out" };
})();
const MIN = 60;
const W = () => innerWidth;
// The bar's height (bar.js): the layout is what's under it.
let barHeight = 0;
// The bar's minimap (minimap.js): { update() }, once it's there.
let minimap = null;
const H = () => innerHeight - barHeight;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const focusColor = CONFIG.border.on ? CONFIG.border.active : CONFIG.focusRing.active;
document.documentElement.style.setProperty("--focus", focusColor);
document.documentElement.style.setProperty("--hint", CONFIG.insertHint.color);

// ---------------------------------------------------------------- layout model
// Items are "w:<window id>" or "t:<tab id>".
// workspace: { id, columns: [column], active, viewX, floating: [{ key, x, y, w, h }],
//              floatActive, focusFloating }
// column: { items: [key], active, width: { p } | { px }, full, tabbed, heights: { key: p } }
const newWorkspace = () => ({
  id: crypto.randomUUID().slice(0, 8), columns: [], active: 0, viewX: -g,
  floating: [], floatActive: 0, focusFloating: false,
});
const newColumn = (key) => ({
  items: [key], active: 0, width: { p: CONFIG.defaultColumnWidth }, full: false, tabbed: false, heights: {},
});
let layout = { workspaces: [newWorkspace()], cur: 0 };
let overview = false;
const curWs = () => layout.workspaces[layout.cur];
const isEmpty = (ws) => ws.columns.length === 0 && ws.floating.length === 0;

function focusedKey(ws = curWs()) {
  if (ws.focusFloating && ws.floating.length) return ws.floating[ws.floatActive]?.key ?? null;
  const col = ws.columns[ws.active];
  return col ? col.items[col.active] : null;
}

/** Where `key` is: { wi, ci, ii } for a tiled item, { wi, fi } for a floating one. */
function find(key) {
  for (const [wi, ws] of layout.workspaces.entries()) {
    for (const [ci, col] of ws.columns.entries()) {
      const ii = col.items.indexOf(key);
      if (ii >= 0) return { wi, ci, ii };
    }
    const fi = ws.floating.findIndex((f) => f.key === key);
    if (fi >= 0) return { wi, fi };
  }
  return null;
}

// Always exactly one empty workspace at the bottom; other empty ones go away
// once they aren't focused.
function normalize() {
  const list = layout.workspaces;
  for (let i = list.length - 2; i >= 0; i--) {
    if (isEmpty(list[i]) && i !== layout.cur) {
      list.splice(i, 1);
      if (i < layout.cur) layout.cur--;
    }
  }
  if (!isEmpty(list.at(-1))) list.push(newWorkspace());
  // Two trailing empty ones only while the focused one is the first of them.
  while (list.length >= 2 && isEmpty(list.at(-1)) && isEmpty(list.at(-2)) && layout.cur < list.length - 2) list.pop();
  layout.cur = clamp(layout.cur, 0, list.length - 1);
  for (const ws of list) {
    ws.active = clamp(ws.active, 0, Math.max(0, ws.columns.length - 1));
    ws.floatActive = clamp(ws.floatActive, 0, Math.max(0, ws.floating.length - 1));
    if (!ws.floating.length) ws.focusFloating = false;
    if (!ws.columns.length && ws.floating.length) ws.focusFloating = true;
    for (const col of ws.columns) col.active = clamp(col.active, 0, col.items.length - 1);
  }
}

// ---------------------------------------------------------------- geometry
function colWidth(col) {
  if (col.full) return W() - 2 * g;
  const w = col.width.px ?? (W() - g) * col.width.p - g;
  return clamp(Math.round(w), MIN, W() * 4);
}
const proportionOf = (col) => (col.full ? 1 : col.width.p ?? (colWidth(col) + g) / (W() - g));
function colX(ws, ci) {
  let x = 0;
  for (let i = 0; i < ci; i++) x += colWidth(ws.columns[i]) + g;
  return x;
}
function itemHeights(col) {
  const n = col.items.length;
  const total = H() - g * (n + 1);
  const fixed = col.items.map((k) => (col.heights[k] !== undefined ? Math.max(MIN, (H() - g) * col.heights[k] - g) : null));
  // With nothing left to stretch, the last window takes the rest.
  if (fixed.every((h) => h !== null)) fixed[n - 1] = null;
  const autos = fixed.filter((h) => h === null).length;
  const used = fixed.reduce((s, h) => s + (h ?? 0), 0);
  const auto = Math.max(MIN, (total - used) / autos);
  return fixed.map((h) => Math.round(h ?? auto));
}
const ovGap = () => H() * 0.2;
const wsSpacing = () => H() + (overview ? ovGap() : 0);
// A vertical swipe's offset of the workspaces, while it lasts (see gestures).
let gestureY = 0;
const wsTop = (wi) => (wi - layout.cur) * wsSpacing() + gestureY;

// Scrolls `ws` so its focused column is on screen (niri's center-focused-column).
function ensureVisible(ws = curWs(), prev = null) {
  const col = ws.columns[ws.active];
  if (!col) return;
  const x = colX(ws, ws.active);
  const w = colWidth(col);
  const center = () => { ws.viewX = x + w / 2 - W() / 2; };
  if (w > W() - 2 * g) { ws.viewX = x - g; return; }
  let mode = CONFIG.centerFocusedColumn;
  if (mode === "on-overflow" && prev !== null && ws.columns[prev]) {
    const px = colX(ws, prev);
    const span = Math.max(px + colWidth(ws.columns[prev]), x + w) - Math.min(px, x);
    mode = span + 2 * g > W() ? "always" : "never";
  }
  if (mode === "always") return center();
  if (x - g < ws.viewX) ws.viewX = x - g;
  else if (x + w + g > ws.viewX + W()) ws.viewX = x + w + g - W();
}

// ---------------------------------------------------------------- items
let shell = null;
let ready = false;
const tiles = new Map(); // key → { el, content, hit, kind, id }
const live = () => {
  const keys = new Set();
  if (!shell) return keys;
  for (const w of shell.windows.values()) if (manages(w) || claiming.has(`w:${w.id}`)) keys.add(`w:${w.id}`);
  if (shell.tabsAvailable) {
    for (const t of shell.tabs.values()) {
      if ((t.tags.includes(TAG) && onThisOutput(t.tags)) || claiming.has(`t:${t.id}`)) keys.add(`t:${t.id}`);
    }
  }
  return keys;
};
// Items this page took whose tags don't say so yet.
const claiming = new Set();
const tagsOf = (w) => (w.tags.length ? w.tags : w.threadId ? [w.threadId] : []);
const adopted = new Set(); // windows taken in without tags (a browser without tags)
function manages(w) {
  if (w.threadId === undefined) return false; // not known yet
  return (tagsOf(w).includes(TAG) || adopted.has(w.id)) && onThisOutput(tagsOf(w));
}

// Several displays: this page's output tag ("" with one display, or an older browser).
const ownOutput = () => (shell?.display && shell.displays.length > 1 ? OUTPUT_PREFIX + shell.display.id : "");
// The output an item is on: its last output tag, if that display is there; else the
// focused display's (it takes such items, see claimOutputs()).
function outputOf(tags) {
  const tag = tags.filter((t) => t.startsWith(OUTPUT_PREFIX)).at(-1);
  if (tag && shell.displays.some((d) => OUTPUT_PREFIX + d.id === tag)) return tag;
  const focused = shell.displays.find((d) => d.focused);
  return focused ? OUTPUT_PREFIX + focused.id : "";
}
function onThisOutput(tags) {
  const own = ownOutput();
  return !own || outputOf(tags) === own;
}
// Tags that put an item on this output (and take it off the others).
function outputTags(tags) {
  const own = ownOutput();
  return {
    add: own ? [TAG, own] : [TAG],
    remove: tags.filter((t) => t.startsWith(OUTPUT_PREFIX) && t !== own),
  };
}
// The focused display's page names the output of items that have none (new ones), or
// whose display went away.
function claimOutputs() {
  const own = ownOutput();
  for (const key of [...claiming]) {
    const [kind, raw] = key.split(":");
    const item = kind === "w" ? shell.windows.get(Number(raw)) : shell.tabs.get(Number(raw));
    if (!item || (kind === "w" ? manages(item) : item.tags.includes(TAG) && onThisOutput(item.tags))) {
      claiming.delete(key);
    }
  }
  if (!own || !shell.display?.focused || !shell.tagsAvailable) return;
  const claim = (tags, tagItem) => {
    if (!tags.includes(TAG) || !onThisOutput(tags) || tags.includes(own)) return;
    const { add, remove } = outputTags(tags);
    tagItem(add, remove).catch(() => {});
  };
  for (const w of shell.windows.values()) claim(tagsOf(w), (add, remove) => shell.tagWindow(w.id, add, remove));
  if (shell.tabsAvailable) {
    for (const t of shell.tabs.values()) claim(t.tags, (add, remove) => shell.tagTab(t.id, add, remove));
  }
}

// Windows nobody claims (no tag at all) are this shell's: a window manager shows everything.
function adoptStrays() {
  if (!shell) return;
  for (const w of shell.windows.values()) {
    if (w.threadId !== null || tagsOf(w).length || adopted.has(w.id)) continue;
    adopted.add(w.id);
    if (shell.tagsAvailable) shell.tagWindow(w.id, [TAG]).catch(() => {});
  }
  if (shell.tabsAvailable) {
    // Not a link another shell's page just opened: that shell is putting it
    // in one of its threads (onOpenTab).
    const othersLink = (t) => t.openedBy.startsWith("shell:") && t.openedBy !== `shell:${shell.shellId}`;
    for (const t of shell.tabs.values()) {
      if (!t.tags.length && !othersLink(t)) shell.tagTab(t.id, [TAG]).catch(() => {});
    }
  }
}

/** Adds `key` as a new column right of the focused one, on the current workspace. */
function addItem(key, { focus = true } = {}) {
  if (find(key)) return;
  const ws = curWs();
  const prev = ws.active;
  const at = ws.columns.length ? ws.active + 1 : 0;
  ws.columns.splice(at, 0, newColumn(key));
  if (focus || ws.columns.length === 1) {
    ws.active = at;
    ws.focusFloating = false;
    ensureVisible(ws, prev);
  } else if (at <= ws.active) ws.active++;
  openAnimation.add(key);
  normalize();
}

/** Takes `key` out of the layout. Its column goes too if it was the last item. */
function detach(key) {
  const at = find(key);
  if (!at) return null;
  const ws = layout.workspaces[at.wi];
  if (at.fi !== undefined) {
    const [f] = ws.floating.splice(at.fi, 1);
    if (ws.floatActive >= ws.floating.length) ws.floatActive = ws.floating.length - 1;
    return { ...at, floating: f };
  }
  const col = ws.columns[at.ci];
  col.items.splice(at.ii, 1);
  delete col.heights[key];
  if (at.ii < col.active || col.active >= col.items.length) col.active = Math.max(0, col.active - 1);
  if (!col.items.length) {
    ws.columns.splice(at.ci, 1);
    // niri: the column that slides in from the right takes the focus.
    if (at.ci < ws.active || ws.active >= ws.columns.length) ws.active = Math.max(0, ws.active - 1);
  }
  return at;
}

function removeItem(key) {
  const at = detach(key);
  const tile = tiles.get(key);
  if (tile) { tile.el.remove(); tiles.delete(key); }
  if (at) {
    const ws = layout.workspaces[at.wi];
    if (ws.columns.length) ensureVisible(ws);
    normalize();
  }
}

// Brings the layout in line with the broker: new items get a column, gone ones leave.
function reconcile() {
  if (!ready) return;
  adoptStrays();
  claimOutputs();
  const keys = live();
  for (const key of [...tiles.keys()]) if (!keys.has(key)) removeItem(key);
  for (const ws of layout.workspaces) {
    for (const col of ws.columns) col.items = col.items.filter((k) => keys.has(k) || tiles.has(k));
    ws.columns = ws.columns.filter((c) => c.items.length);
    ws.floating = ws.floating.filter((f) => keys.has(f.key) || tiles.has(f.key));
  }
  // (Not a window being moved: it's out of the layout until it's dropped.)
  for (const key of keys) if (!find(key) && !(drag?.held && drag.key === key)) addItem(key);
  normalize();
}

// ---------------------------------------------------------------- rendering
const openAnimation = new Set();
function tileFor(key) {
  let tile = tiles.get(key);
  if (tile) return tile;
  const [kind, raw] = key.split(":");
  const id = Number(raw);
  const el = document.createElement("div");
  el.className = "tile";
  let content;
  if (kind === "w") {
    content = document.createElement("native-window");
    // On a resize, its frame from before fades into its new one with the
    // tiles' duration and easing, as niri mixes them.
    content.crossfade = ANIM.ms;
    content.crossfadeEasing = ANIM.easing;
    // A window drawing at its new size may complete a transaction.
    content.addEventListener("windowchange", completeTransaction);
    content.addEventListener("windowfocus", () => onItemFocused(key));
    // The app's own maximize button: niri's maximize column.
    content.addEventListener("windowrequest", (e) => {
      if (e.request === "move" || e.request === "resize") {
        startAppDrag(key, e.request === "resize", e.edge);
        return;
      }
      if (e.request !== "maximize" && e.request !== "unmaximize") return;
      const where = find(key);
      if (!where || where.ci === undefined) return;
      const col = layout.workspaces[where.wi].columns[where.ci];
      col.full = e.request === "maximize";
      focusItem(key);
      ensureVisible();
      commit();
    });
    content.addEventListener("windowerror", () => notice("could not show a window"));
    // Another page (another display's shell) shows it now: a placeholder until it's back.
    content.addEventListener("windowtaken", () => el.classList.add("taken"));
    content.addEventListener("windowchange", () => el.classList.toggle("taken", content.windowState === "taken"));
    shell.grantFor(id).then((grant) => {
      content.setAttribute("window", String(id));
      content.setAttribute("grant", grant);
    }, () => notice("no grant for a window"));
  } else {
    content = shell.tabElement(id);
  }
  const hit = document.createElement("div");
  hit.className = "hit";
  bindPointer(hit, key);
  el.append(content, hit);
  $("world").append(el);
  tile = { el, content, hit, kind, id, dialog: null };
  tiles.set(key, tile);
  return tile;
}

// As in niri, a layout change that resizes windows is a transaction: the
// windows are asked for their new sizes at once, and nothing moves until they
// have drawn at new sizes (or TRANSACTION_MS passed); meanwhile a window is scaled
// back to the size it was shown at. Then the tiles' CSS transitions, a FLIP
// animation scaling each window from that size, and its crossfade (the same
// duration and easing) start together.
const TRANSACTION_MS = 300;
let placements = [];
let transaction = null;

function placeTile(tile, x, y, w, h) {
  w = Math.max(1, Math.round(w));
  h = Math.max(1, Math.round(h));
  const placement = { tile, x: Math.round(x), y: Math.round(y), w, h };
  // A new tile, or one being dragged, goes where it should at once.
  if (!tile.el.style.width || tile.el.classList.contains("dragging")) applyPlacement(placement);
  else placements.push(placement);
  if (tile.kind !== "w") return;
  const b = CONFIG.border.on ? CONFIG.border.width : 0;
  const iw = Math.max(1, w - 2 * b), ih = Math.max(1, h - 2 * b);
  const old = tile.inner;
  tile.inner = { w: iw, h: ih };
  tile.content.style.width = `${iw}px`;
  tile.content.style.height = `${ih}px`;
  // Wait for a window the user sees resize, if it's attached to draw it.
  const shown = tile.shown ?? old;
  tile.awaiting = shown && (shown.w !== iw || shown.h !== ih) &&
    !document.body.classList.contains("noanim") && !document.body.classList.contains("overview") &&
    !tile.el.classList.contains("dragging") && !tile.el.classList.contains("hidden") &&
    tile.content.windowState === "attached" &&
    x < W() && x + w > 0 && y < H() && y + h > 0;
  if (tile.awaiting) {
    // Asked for a new size: any other size it draws is its answer (a terminal
    // snaps to whole cells).
    if (!old || old.w !== iw || old.h !== ih) {
      tile.askedAt = { w: tile.content.windowWidth, h: tile.content.windowHeight };
    }
    tile.shown = shown;
    tile.content.style.transform = `scale(${shown.w / iw}, ${shown.h / ih})`;
  } else {
    tile.shown = null;
    tile.content.style.transform = "";
  }
}

function answered(tile) {
  const { windowWidth: w, windowHeight: h } = tile.content;
  return w !== tile.askedAt.w || h !== tile.askedAt.h ||
    (Math.abs(w - tile.inner.w) <= 1 && Math.abs(h - tile.inner.h) <= 1);
}

// Called once render() has placed every tile.
function placeTiles() {
  const list = placements;
  placements = [];
  if (!transaction) transaction = { timer: setTimeout(() => applyPlacements(), TRANSACTION_MS) };
  transaction.list = list;
  completeTransaction();
}

function completeTransaction() {
  if (!transaction) return;
  for (const tile of tiles.values()) if (tile.awaiting && !answered(tile)) return;
  applyPlacements();
}

function applyPlacements() {
  if (!transaction) return;
  clearTimeout(transaction.timer);
  const { list } = transaction;
  transaction = null;
  list.forEach(applyPlacement);
  for (const tile of tiles.values()) {
    if (!tile.awaiting) continue;
    tile.awaiting = false;
    const { w, h } = tile.shown;
    tile.shown = null;
    tile.content.style.transform = "";
    tile.content.animate([{ transform: `scale(${w / tile.inner.w}, ${h / tile.inner.h})` }, { transform: "none" }],
      { duration: ANIM.ms, easing: ANIM.easing });
  }
}

// Whole device pixels: at a fractional scale (1.78) a whole CSS pixel isn't
// one, and a window drawn at a fractional device position is blurred and
// can't go on a display plane. (Blink snaps the window inside the tile.)
const snap = (v) => Math.round(v * devicePixelRatio) / devicePixelRatio;

function applyPlacement({ tile, x, y, w, h }) {
  tile.at = { x, y, w, h };
  tile.el.style.transform = `translate3d(${snap(x)}px, ${snap(y)}px, 0)`;
  tile.el.style.width = `${w}px`;
  tile.el.style.height = `${h}px`;
}

function styleTile(tile, active) {
  const s = tile.el.style;
  const b = CONFIG.border.on ? CONFIG.border.width : 0;
  s.borderRadius = `${CONFIG.cornerRadius + b}px`;
  s.border = b ? `${b}px solid ${active ? CONFIG.border.active : CONFIG.border.inactive}` : "0";
  const sh = CONFIG.shadow;
  s.boxShadow = sh.on ? `${sh.offsetX}px ${sh.offsetY}px ${sh.softness}px ${sh.spread}px ${sh.color}` : "none";
  const fr = CONFIG.focusRing;
  s.outline = fr.on && active ? `${fr.width}px solid ${fr.active}` : "none";
}

function render() {
  const world = $("world");
  document.body.classList.toggle("overview", overview);
  const z = CONFIG.overviewZoom;
  world.style.transform = overview ? `scale(${z})` : "none";
  // The overview zooms out around the screen's center: undo it for the cards' outlines.
  const focus = focusedKey();
  const seen = new Set();

  // Workspace cards.
  const cards = [...world.querySelectorAll(".wscard")];
  layout.workspaces.forEach((ws, wi) => {
    let card = cards.find((c) => c.dataset.ws === ws.id);
    if (!card) {
      card = document.createElement("div");
      card.className = "wscard";
      card.dataset.ws = ws.id;
      // A click goes to the workspace; a drag drags the view (see gestures).
      card.onpointerdown = (e) => {
        if (e.button !== 0) return;
        e.preventDefault();
        startPan(e, () => {
          const i = layout.workspaces.findIndex((w) => w.id === ws.id);
          if (i >= 0) { layout.cur = i; overview = false; updateShortcuts(); commit(); }
        });
      };
      world.prepend(card);
    }
    card.style.width = `${W()}px`;
    card.style.height = `${H()}px`;
    card.style.transform = `translate3d(0, ${wsTop(wi)}px, 0)`;
    card.classList.toggle("current", wi === layout.cur);
    seen.add(card);
  });
  for (const c of cards) if (!seen.has(c)) c.remove();

  // Tiles, and tab indicators of tabbed columns.
  const indicators = [...world.querySelectorAll(".tabind")];
  let nextIndicator = 0;
  layout.workspaces.forEach((ws, wi) => {
    const top = wsTop(wi);
    let x = 0;
    ws.columns.forEach((col, ci) => {
      const w = colWidth(col);
      const sx = x - ws.viewX;
      if (col.tabbed) {
        col.items.forEach((key, ii) => {
          const tile = tileFor(key);
          placeTile(tile, sx, top + g, w, H() - 2 * g);
          tile.el.classList.toggle("hidden", ii !== col.active);
          tile.el.classList.remove("floating");
          tile.el.style.zIndex = "";
          styleTile(tile, key === focus);
        });
        const ind = indicators[nextIndicator++] ?? world.appendChild(Object.assign(document.createElement("div"), { className: "tabind" }));
        const len = (H() - 2 * g) * 0.5;
        ind.style.width = "10px";
        ind.style.height = `${len}px`;
        ind.style.transform = `translate3d(${Math.round(sx - 12)}px, ${Math.round(top + g + (H() - 2 * g - len) / 2)}px, 0)`;
        // A click on a tab's bar goes to that tab.
        ind.replaceChildren(...col.items.map((key, ii) => {
          const span = Object.assign(document.createElement("span"), { className: ii === col.active ? "active" : "" });
          span.onpointerdown = (e) => { e.preventDefault(); e.stopPropagation(); };
          span.onclick = () => { focusItem(key); refocus(); commit(); };
          return span;
        }));
      } else {
        const hs = itemHeights(col);
        let y = g;
        col.items.forEach((key, ii) => {
          const tile = tileFor(key);
          placeTile(tile, sx, top + y, w, hs[ii]);
          tile.el.classList.remove("hidden", "floating");
          tile.el.style.zIndex = "";
          styleTile(tile, key === focus);
          y += hs[ii] + g;
        });
      }
      x += w + g;
    });
    ws.floating.forEach((f) => {
      const tile = tileFor(f.key);
      placeTile(tile, f.x, top + f.y, f.w, f.h);
      tile.el.classList.remove("hidden");
      tile.el.classList.add("floating");
      tile.el.style.zIndex = String(2 + ws.floating.indexOf(f));
      styleTile(tile, f.key === focus);
    });
  });
  for (const ind of indicators.slice(nextIndicator)) ind.remove();
  placeTiles();
  renderHint();

  for (const key of openAnimation) {
    const tile = tiles.get(key);
    if (!tile || document.body.classList.contains("noanim")) continue;
    // The whole tile (its border and shadow with the window), from its center,
    // as niri opens a window. `scale` composes with the tile's placement.
    tile.el.animate([{ scale: ".5", opacity: 0 }, { scale: "1", opacity: 1 }],
      { duration: 200, easing: "cubic-bezier(.16, 1, .3, 1)" });
  }
  openAnimation.clear();
  for (const tile of tiles.values()) if (tile.kind === "t") renderTabDialog(tile);

  const hint = $("empty-hint");
  hint.hidden = !isEmpty(curWs()) || !ready;
  hint.textContent = !shell?.available
    ? "This page is not the Plutonium shell (no window broker)."
    : `Workspace ${layout.cur + 1} · Super+T terminal · Super+D run · Super+Shift+/ hotkeys`;
  syncKeyboard();
  save();
  minimap?.update();
}

// A tab's page dialog (alert, confirm, prompt), drawn over its tile.
function renderTabDialog(tile) {
  const tab = shell.tabs.get(tile.id);
  const pending = tab?.dialogType ? `${tab.dialogType}:${tab.dialogMessage}` : null;
  if (tile.dialog?.dataset.pending === pending) return;
  tile.dialog?.remove();
  tile.dialog = null;
  if (!pending) return;
  const box = document.createElement("form");
  box.className = "tabdialog";
  box.dataset.pending = pending;
  const message = Object.assign(document.createElement("p"), { textContent: tab.dialogMessage || "This page asks to leave." });
  const input = Object.assign(document.createElement("input"), { value: tab.dialogDefaultPrompt, hidden: tab.dialogType !== "prompt" });
  const row = document.createElement("div");
  const cancel = Object.assign(document.createElement("button"), { type: "button", textContent: "Cancel", hidden: tab.dialogType === "alert" });
  cancel.onclick = () => shell.answerTabDialog(tab.id, false);
  row.append(cancel, Object.assign(document.createElement("button"), { textContent: tab.dialogType === "beforeunload" ? "Leave" : "OK" }));
  box.append(message, input, row);
  box.onsubmit = (e) => { e.preventDefault(); shell.answerTabDialog(tab.id, true, input.value); };
  tile.el.append(box);
  tile.dialog = box;
}

// ---------------------------------------------------------------- keyboard focus
let appliedFocus = undefined;
let modal = null; // "launcher" | "hotkeys" | null
function syncKeyboard() {
  if (!shell?.available || modal || document.visibilityState !== "visible") return;
  const key = focusedKey();
  if (key === appliedFocus) return;
  appliedFocus = key;
  const tile = key && tiles.get(key);
  if (!tile) {
    // Nothing to focus here: keys go to the page (and so to our binds).
    for (const t of tiles.values()) if (t.kind === "w" && t.content.windowFocused) t.content.blurWindow();
    document.activeElement?.blur?.();
    return;
  }
  if (tile.kind === "w") {
    if (tile.content.windowState === "attached") tile.content.focusWindow();
    else {
      // Not attached yet (just opened): focus once it is.
      const retry = () => { if (focusedKey() === key && !modal) tile.content.focusWindow(); };
      tile.content.addEventListener("windowchange", retry, { once: true });
      setTimeout(retry, 300);
    }
  } else {
    tile.content.focus();
  }
}
function refocus() { appliedFocus = undefined; syncKeyboard(); }

// A click on an app (or its own request) moved the keyboard there: follow it.
function onItemFocused(key) {
  if (focusedKey() === key) { appliedFocus = key; return; }
  if (!focusItem(key)) return;
  appliedFocus = key;
  commit();
}

// A window another page took comes back here (attaching again is a new claim).
function reclaim(key) {
  const tile = tiles.get(key);
  if (!tile || tile.kind !== "w" || tile.content.windowState !== "taken") return;
  const grant = tile.content.getAttribute("grant");
  tile.content.removeAttribute("grant");
  tile.content.setAttribute("grant", grant);
}

/** Makes `key` the focused item (switching workspace if needed). */
function focusItem(key) {
  const at = find(key);
  if (!at) return false;
  // A hidden page asking gets it when it's shown (the browser decides).
  reclaim(key);
  const ws = layout.workspaces[at.wi];
  layout.cur = at.wi;
  if (at.fi !== undefined) {
    ws.focusFloating = true;
    ws.floatActive = at.fi;
  } else {
    const prev = ws.active;
    ws.focusFloating = false;
    ws.active = at.ci;
    ws.columns[at.ci].active = at.ii;
    ensureVisible(ws, prev);
  }
  normalize();
  return true;
}

function commit() {
  normalize();
  render();
}

// ---------------------------------------------------------------- actions
const tiledCol = () => { const ws = curWs(); return ws.focusFloating ? null : ws.columns[ws.active]; };
const focusedFloat = () => { const ws = curWs(); return ws.focusFloating ? ws.floating[ws.floatActive] : null; };

const actions = {
  focusColumn(d) {
    const ws = curWs();
    if (ws.focusFloating) {
      if (!ws.floating.length) return;
      ws.floatActive = (ws.floatActive + d + ws.floating.length) % ws.floating.length;
      return;
    }
    const prev = ws.active;
    ws.active = clamp(ws.active + d, 0, ws.columns.length - 1);
    ensureVisible(ws, prev);
  },
  focusColumnEdge(last) {
    const ws = curWs();
    ws.focusFloating = false;
    const prev = ws.active;
    ws.active = last ? ws.columns.length - 1 : 0;
    ensureVisible(ws, prev);
  },
  focusWindow(d) {
    const col = tiledCol();
    if (col) col.active = clamp(col.active + d, 0, col.items.length - 1);
    else actions.focusColumn(d);
  },
  moveColumn(d) {
    const ws = curWs();
    const f = focusedFloat();
    if (f) { f.x += d * 50; return; }
    const to = ws.active + d;
    if (to < 0 || to >= ws.columns.length) return;
    [ws.columns[ws.active], ws.columns[to]] = [ws.columns[to], ws.columns[ws.active]];
    ws.active = to;
    ensureVisible(ws);
  },
  moveColumnEdge(last) {
    const ws = curWs();
    if (ws.focusFloating || !ws.columns.length) return;
    const [col] = ws.columns.splice(ws.active, 1);
    if (last) ws.columns.push(col); else ws.columns.unshift(col);
    ws.active = last ? ws.columns.length - 1 : 0;
    ensureVisible(ws);
  },
  moveWindow(d) {
    const f = focusedFloat();
    if (f) { f.y += d * 50; return; }
    const col = tiledCol();
    if (!col) return;
    const to = col.active + d;
    if (to < 0 || to >= col.items.length) return;
    [col.items[col.active], col.items[to]] = [col.items[to], col.items[col.active]];
    col.active = to;
  },
  focusWorkspace(i) {
    layout.cur = clamp(i, 0, layout.workspaces.length - 1);
  },
  focusWorkspaceDelta(d) { actions.focusWorkspace(layout.cur + d); },
  moveColumnToWorkspace(i) {
    const from = curWs();
    const key = focusedKey();
    if (!key) return;
    i = clamp(i, 0, layout.workspaces.length - 1);
    if (i === layout.cur) return;
    const to = layout.workspaces[i];
    if (from.focusFloating) {
      const [f] = from.floating.splice(from.floatActive, 1);
      to.floating.push(f);
      to.floatActive = to.floating.length - 1;
      to.focusFloating = true;
    } else {
      const [col] = from.columns.splice(from.active, 1);
      if (from.active >= from.columns.length) from.active = Math.max(0, from.columns.length - 1);
      const at = to.columns.length ? to.active + 1 : 0;
      to.columns.splice(at, 0, col);
      to.active = at;
      to.focusFloating = false;
      ensureVisible(to);
    }
    if (from.columns.length) ensureVisible(from);
    layout.cur = i;
  },
  moveColumnToWorkspaceDelta(d) { actions.moveColumnToWorkspace(layout.cur + d); },
  moveWorkspace(d) {
    const list = layout.workspaces;
    const to = layout.cur + d;
    if (to < 0 || to >= list.length) return;
    [list[layout.cur], list[to]] = [list[to], list[layout.cur]];
    layout.cur = to;
  },
  consumeOrExpel(d) {
    const ws = curWs();
    const col = tiledCol();
    if (!col) return;
    const key = col.items[col.active];
    if (col.items.length > 1) {
      // Expel into a new column on that side.
      col.items.splice(col.active, 1);
      delete col.heights[key];
      col.active = Math.min(col.active, col.items.length - 1);
      const at = d < 0 ? ws.active : ws.active + 1;
      ws.columns.splice(at, 0, { ...newColumn(key), width: { ...col.width } });
      ws.active = at;
    } else {
      // Join the neighbouring column, at its bottom.
      const target = ws.columns[ws.active + d];
      if (!target) return;
      target.items.push(key);
      target.active = target.items.length - 1;
      ws.columns.splice(ws.active, 1);
      ws.active = ws.columns.indexOf(target);
    }
    ensureVisible(ws);
  },
  consumeIntoColumn() {
    const ws = curWs();
    const col = tiledCol();
    const next = ws.columns[ws.active + 1];
    if (!col || !next) return;
    col.items.push(next.items.shift());
    if (!next.items.length) ws.columns.splice(ws.active + 1, 1);
    else next.active = Math.min(next.active, next.items.length - 1);
  },
  expelFromColumn() {
    const ws = curWs();
    const col = tiledCol();
    if (!col || col.items.length < 2) return;
    const [key] = col.items.splice(col.active, 1);
    delete col.heights[key];
    col.active = Math.min(col.active, col.items.length - 1);
    ws.columns.splice(ws.active + 1, 0, { ...newColumn(key), width: { ...col.width } });
    ws.active++;
    ensureVisible(ws);
  },
  switchPresetColumnWidth() {
    const col = tiledCol();
    if (!col) return;
    const p = proportionOf(col);
    const presets = CONFIG.presetColumnWidths;
    const next = presets.find((x) => x > p + 0.01) ?? presets[0];
    col.width = { p: next };
    col.full = false;
    ensureVisible();
  },
  switchPresetWindowHeight() {
    const col = tiledCol();
    if (!col || col.items.length < 2) return;
    const key = col.items[col.active];
    const h = itemHeights(col)[col.active];
    const p = col.heights[key] ?? (h + g) / (H() - g);
    const presets = CONFIG.presetWindowHeights;
    col.heights[key] = presets.find((x) => x > p + 0.01) ?? presets[0];
  },
  resetWindowHeight() {
    const col = tiledCol();
    if (col) col.heights = {};
  },
  maximizeColumn() {
    const col = tiledCol();
    if (!col) return;
    col.full = !col.full;
    ensureVisible();
  },
  fullscreenWindow() {
    const tile = tiles.get(focusedKey());
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else tile?.content.requestFullscreen().catch((e) => notice(`fullscreen: ${e.message}`));
  },
  expandColumn() {
    // Take the space the other fully visible columns leave.
    const ws = curWs();
    const col = tiledCol();
    if (!col) return;
    let others = 0;
    ws.columns.forEach((c, ci) => {
      if (ci === ws.active) return;
      const x = colX(ws, ci) - ws.viewX;
      if (x >= 0 && x + colWidth(c) <= W()) others += colWidth(c) + g;
    });
    col.full = false;
    col.width = { px: W() - 2 * g - others };
    ensureVisible(ws);
  },
  centerColumn() {
    const ws = curWs();
    const col = tiledCol();
    if (col) ws.viewX = colX(ws, ws.active) + colWidth(col) / 2 - W() / 2;
  },
  centerVisibleColumns() {
    const ws = curWs();
    const visible = ws.columns.map((c, ci) => ci).filter((ci) => {
      const x = colX(ws, ci) - ws.viewX;
      return x >= 0 && x + colWidth(ws.columns[ci]) <= W();
    });
    if (!visible.length) return actions.centerColumn();
    const a = colX(ws, visible[0]);
    const b = colX(ws, visible.at(-1)) + colWidth(ws.columns[visible.at(-1)]);
    ws.viewX = (a + b) / 2 - W() / 2;
  },
  setColumnWidth(delta) {
    const f = focusedFloat();
    if (f) { f.w = clamp(f.w + delta * W(), MIN, W()); return; }
    const col = tiledCol();
    if (!col) return;
    col.width = { p: clamp(proportionOf(col) + delta, 0.05, 1) };
    col.full = false;
    ensureVisible();
  },
  setWindowHeight(delta) {
    const f = focusedFloat();
    if (f) { f.h = clamp(f.h + delta * H(), MIN, H()); return; }
    const col = tiledCol();
    if (!col || col.items.length < 2) return;
    const key = col.items[col.active];
    const p = col.heights[key] ?? (itemHeights(col)[col.active] + g) / (H() - g);
    col.heights[key] = clamp(p + delta, 0.05, 1);
  },
  toggleFloating() {
    const ws = curWs();
    const key = focusedKey();
    if (!key) return;
    if (ws.focusFloating) {
      detach(key);
      const at = ws.columns.length ? ws.active + 1 : 0;
      ws.columns.splice(at, 0, newColumn(key));
      ws.active = at;
      ws.focusFloating = false;
      ensureVisible(ws);
    } else {
      // Floats at the size it had as a tile, a bit smaller, centered.
      const col = tiledCol();
      const w = Math.min(colWidth(col), W() * 0.8);
      const h = Math.min(itemHeights(col)[col.active], H() * 0.8);
      detach(key);
      ws.floating.push({ key, w, h, x: (W() - w) / 2, y: (H() - h) / 2 });
      ws.floatActive = ws.floating.length - 1;
      ws.focusFloating = true;
      if (ws.columns.length) ensureVisible(ws);
    }
  },
  switchFocusFloatingTiling() {
    const ws = curWs();
    if (ws.focusFloating ? ws.columns.length : ws.floating.length) ws.focusFloating = !ws.focusFloating;
  },
  toggleTabbed() {
    const col = tiledCol();
    if (col) col.tabbed = !col.tabbed;
  },
  toggleOverview() { overview = !overview; updateShortcuts(); },
  closeWindow() {
    const tile = tiles.get(focusedKey());
    if (!tile) return;
    if (tile.kind === "w") shell.close(tile.id);
    else shell.tabCommand(tile.id, "close");
  },
  spawn(argv) {
    // The user's: links its apps open come to the front (PLUTONIUM_SHOW).
    shell.launch(TAG, argv, { show: true }).catch((e) => notice(`spawn ${argv[0]}: ${e.message}`));
  },
  launcher() { openLauncher(); },
  hotkeys() { showHotkeys(); },
  // niri's screenshot UI: a region or a window, saved to ~/Pictures/Screenshots.
  // Several displays: niri's outputs are the browser's displays.
  focusMonitor(dir) {
    const display = displayToward(dir);
    if (display) shell.focusDisplay(display.id).catch(() => {});
  },
  // The column's windows go to that display's niri, each a column there, the
  // focused one last (so it has the focus).
  moveColumnToMonitor(dir) {
    const display = displayToward(dir);
    const key = focusedKey();
    if (!display || !key) return;
    const col = tiledCol();
    const keys = col ? [...col.items.filter((k) => k !== key), key] : [key];
    for (const k of keys) {
      const [kind, raw] = k.split(":");
      const move = kind === "w" ? shell.showOnDisplay(Number(raw), display.id) : shell.showTabOnDisplay(Number(raw), display.id);
      move.catch(() => {});
    }
  },
  // niri's quit, after its "Are you sure you want to exit niri?": ends the session.
  async quit() {
    if (quitting) return;
    quitting = true;
    for (const t of tiles.values()) if (t.kind === "w" && t.content.windowFocused) t.content.blurWindow();
    try {
      const { confirm } = await import("./tray.js");
      if (await confirm("Are you sure you want to exit niri? This ends the Plutonium session and closes its apps.", "Exit")) {
        await shell.system.power.call("log-out");
      }
    } catch (e) {
      notice(`exit: ${e.message ?? e}`);
    } finally {
      quitting = false;
      refocus();
    }
  },
  lock() {
    shell.system.session.call("lock").catch((e) => notice(`lock: ${e.message ?? e}`));
  },
  async screenshot() {
    if (!shell?.captureAvailable) return notice("no screenshots in this browser");
    const targets = [];
    for (const tile of tiles.values()) {
      const rect = tile.el.getBoundingClientRect();
      if (tile.el.hidden || rect.width < 1 || rect.right <= 0 || rect.left >= innerWidth) continue;
      targets.push({ source: { type: tile.kind === "w" ? "window" : "tab", id: tile.id }, rect });
    }
    try {
      const shot = await shell.takeScreenshot({ targets });
      if (shot) notice(`Screenshot saved to ${shot.path}`);
    } catch (e) { notice(`screenshot: ${e.message}`); }
  },
  async screenshotScreen() {
    if (!shell?.captureAvailable) return notice("no screenshots in this browser");
    try {
      const path = await shell.saveScreenshot(await shell.screenshot(await shell.outputSource()));
      notice(`Screenshot saved to ${path}`);
    } catch (e) { notice(`screenshot: ${e.message}`); }
  },
  async screenshotWindow() {
    const tile = tiles.get(focusedKey());
    if (!tile || !shell?.captureAvailable) return;
    try {
      const path = await shell.saveScreenshot(await shell.screenshot({ type: tile.kind === "w" ? "window" : "tab", id: tile.id }));
      notice(`Screenshot saved to ${path}`);
    } catch (e) { notice(`screenshot: ${e.message}`); }
  },
};

let quitting = false;

// The display to the `dir` ("left", "right", "up", "down") of this page's, nearest first.
function displayToward(dir) {
  const own = shell?.display;
  if (!own || shell.displays.length < 2) return null;
  const cx = own.x + own.width / 2;
  const cy = own.y + own.height / 2;
  let best = null;
  let bestScore = Infinity;
  for (const d of shell.displays) {
    if (d.id === own.id) continue;
    const dx = d.x + d.width / 2 - cx;
    const dy = d.y + d.height / 2 - cy;
    const along = { left: -dx, right: dx, up: -dy, down: dy }[dir];
    if (along <= 0) continue;
    const score = along + 2 * (dir === "left" || dir === "right" ? Math.abs(dy) : Math.abs(dx));
    if (score < bestScore) { best = d; bestScore = score; }
  }
  return best;
}

// ---------------------------------------------------------------- binds
// niri's default binds (its default config.kdl), with Mod = Super.

function bind(keys, label, action, { repeat = true, hotkey = false } = {}) {

}

const byCombo = new Map(binds.flatMap((b) => b.keys.map((k) => [k, b])));
const comboOf = (e) =>
  `${e.metaKey ? "Super+" : ""}${e.ctrlKey ? "Ctrl+" : ""}${e.altKey ? "Alt+" : ""}${e.shiftKey ? "Shift+" : ""}${e.code}`;
// Normalize "Super+Shift+KeyR" etc. to comboOf's order.
const normalizeCombo = (text) => {
  const parts = text.split("+");
  const code = parts.pop();
  const has = (m) => parts.includes(m);
  return `${has("Super") ? "Super+" : ""}${has("Ctrl") ? "Ctrl+" : ""}${has("Alt") ? "Alt+" : ""}${has("Shift") ? "Shift+" : ""}${code}`;
};
for (const [k, b] of [...byCombo]) { byCombo.delete(k); byCombo.set(normalizeCombo(k), b); }

// Keys this page keeps while an app or tab has the keyboard: every bind,
// Super itself (so Super+drag and Super+wheel reach the page), and Escape and
// Enter while the overview is open.
function updateShortcuts() {
  shell?.setShellShortcuts([
    ...byCombo.keys(),
    "MetaLeft", "MetaRight", "Super+MetaLeft", "Super+MetaRight",
    ...(overview ? ["Escape", "Enter", "KeyO"] : []),
  ]);
}

addEventListener("keydown", (e) => {
  if (e.code === "MetaLeft" || e.code === "MetaRight") { setMod(true); return; }
  if (modal === "hotkeys") { closeModal(); if (!e.metaKey) { e.preventDefault(); return; } }
  if (overview && !e.metaKey && (e.code === "Escape" || e.code === "Enter")) {
    e.preventDefault();
    overview = false;
    updateShortcuts();
    commit();
    return;
  }
  const b = byCombo.get(comboOf(e));
  if (!b) return;
  e.preventDefault();
  e.stopPropagation();
  if (e.repeat && !b.repeat) return;
  if (modal === "launcher" && b.action !== actions.launcher) closeModal();
  b.action();
  commit();
}, true);
addEventListener("keyup", (e) => { if (e.code === "MetaLeft" || e.code === "MetaRight") setMod(false); }, true);
addEventListener("blur", () => setMod(false));

// ---------------------------------------------------------------- pointer
// Super held: the windows' hit layers take the pointer, for Super+drag
// (move), Super+right-drag (resize) and Super+middle-drag (the view). A
// missed release is noticed on the next pointer event without Super.
function setMod(on) { document.body.classList.toggle("mod", on); }
addEventListener("pointermove", (e) => { if (!e.metaKey && !drag && !pan) setMod(false); }, true);

// Page coordinates to the world's (the layout's, before the overview's zoom).
function toWorld(px, py) {
  const z = overview ? CONFIG.overviewZoom : 1;
  return { x: (px - W() / 2) / z + W() / 2, y: (py - barHeight - H() / 2) / z + H() / 2 };
}

let drag = null;
// A move (or with |resize|, a resize from |edge|: "right", "bottom-left"…) of |key| from (x, y).
function beginDrag(key, x, y, resize, edge = "bottom-right") {
  const at = find(key);
  const tile = tiles.get(key);
  if (!at || !tile) return null;
  const ws = layout.workspaces[at.wi];
  const col = at.fi === undefined ? ws.columns[at.ci] : null;
  const float = at.fi !== undefined ? ws.floating[at.fi] : null;
  drag = {
    key, resize, edge, startX: x, startY: y, lastX: x, lastY: y, moved: false, tile, col, float,
    startW: col ? colWidth(col) : float.w,
    startH: col ? (col.tabbed ? H() - 2 * g : itemHeights(col)[at.ii]) : float.h,
    startFX: float?.x ?? 0, startFY: float?.y ?? 0,
    // While moved: where it came from (it's out of the layout), and where it would go.
    held: null, target: null,
  };
  return drag;
}

function moveDrag(x, y) {
  const d = drag;
  const dx = x - d.startX;
  const dy = y - d.startY;
  d.lastX = x;
  d.lastY = y;
  if (!d.moved && Math.hypot(dx, dy) < 6) return;
  d.moved = true;
  if (d.resize) {
    // Live, as niri resizes interactively: no transitions, no transactions.
    // From the left or top edge, a drag that way grows it.
    const sx = d.edge.includes("left") ? -dx : dx;
    const sy = d.edge.includes("top") ? -dy : dy;
    const sideways = /left|right/.test(d.edge);
    const upDown = /top|bottom/.test(d.edge);
    document.body.classList.add("noanim");
    if (d.float) {
      if (sideways) d.float.w = clamp(d.startW + sx, MIN, W());
      if (upDown) d.float.h = clamp(d.startH + sy, MIN, H());
      // The opposite edge stays put.
      if (d.edge.includes("left")) d.float.x = d.startFX + d.startW - d.float.w;
      if (d.edge.includes("top")) d.float.y = d.startFY + d.startH - d.float.h;
    } else {
      if (sideways) { d.col.full = false; d.col.width = { px: clamp(d.startW + sx, MIN, W() - 2 * g) }; }
      if (upDown && d.col.items.length > 1 && !d.col.tabbed) {
        d.col.heights[d.key] = clamp((d.startH + sy + g) / (H() - g), 0.05, 1);
      }
    }
    render();
    return;
  }
  if (d.float && !overview) {
    d.float.x = d.startFX + dx;
    d.float.y = d.startFY + dy;
    render();
    return;
  }
  if (!d.held) lift(d);
  followPointer(d);
  watchEdges(x, y);
  retarget();
}

// A moved window leaves the layout (the others close up) until it's dropped.
function lift(d) {
  const at = find(d.key);
  const ws = layout.workspaces[at.wi];
  const pos = d.tile.at ?? { x: 0, y: 0 };
  const start = toWorld(d.startX, d.startY);
  d.grab = { x: start.x - pos.x, y: start.y - pos.y };
  d.width = d.col ? { ...d.col.width } : { p: CONFIG.defaultColumnWidth };
  d.held = d.float
    ? { ws, wi: at.wi, fi: at.fi, float: d.float }
    : { ws, wi: at.wi, ci: at.ci, ii: at.ii, col: d.col, height: d.col.heights[d.key] };
  detach(d.key);
  // The view doesn't stay past the columns that are left.
  ws.viewX = clamp(ws.viewX, -g, Math.max(-g, colX(ws, ws.columns.length) - W()));
  d.tile.el.classList.add("dragging");
  d.tile.el.classList.remove("hidden");
  render();
}

function followPointer(d) {
  const p = toWorld(d.lastX, d.lastY);
  d.tile.el.style.transform = `translate3d(${p.x - d.grab.x}px, ${p.y - d.grab.y}px, 0)`;
}

function retarget() {
  const d = drag;
  const target = dropTarget(d.lastX, d.lastY);
  const id = (t) => t && [t.kind, t.ws?.id, t.at, t.dot, t.before && t.ws.columns.indexOf(t.before),
    t.col && t.ws.columns.indexOf(t.col), t.beforeKey, t.afterKey].join();
  if (id(target) === id(d.target)) return;
  d.target = target;
  renderHint();
}

// Ends the drag; a move goes where (x, y) is. The drag, or null.
function endDrag(x, y) {
  const d = drag;
  drag = null;
  if (!d) return null;
  stopEdges();
  d.tile.el.classList.remove("dragging");
  if (d.resize) document.body.classList.remove("noanim");
  // (Its window may have closed meanwhile.)
  if (d.held && tiles.has(d.key)) place(d.key, dropTarget(x, y), { width: d.width, held: d.held });
  renderHint();
  return d;
}

// Where a moved window would go if dropped at (px, py), or null for nowhere:
//   { kind: "column", ws, before }   a new column before column `before` (null: last);
//   { kind: "into", ws, col, beforeKey }   into a column, before that window (null: last);
//   { kind: "tab", ws, col, afterKey }   a tab of that column (which becomes tabbed);
//   { kind: "workspace", at }   a new workspace there (between two in the overview).
// A column's sides make a new column, a window's top and bottom put it into the
// column, its middle (or anywhere on a tabbed column) makes it a tab.
function dropTarget(px, py) {
  // The bar's minimap: onto that workspace, as its last column.
  const dot = document.elementFromPoint(px, py)?.closest?.("[data-niri-ws]");
  if (dot) {
    const ws = layout.workspaces.find((w) => w.id === dot.dataset.niriWs);
    return ws ? { kind: "column", ws, before: null, dot: ws.id } : null;
  }
  if (py < barHeight) return null;
  const p = toWorld(px, py);
  let wi = layout.cur;
  if (overview) {
    const s = wsSpacing();
    const rel = p.y - gestureY;
    const i = Math.floor(rel / s);
    if (rel - i * s > H()) return { kind: "workspace", at: clamp(layout.cur + i + 1, 0, layout.workspaces.length) };
    if (layout.cur + i < 0) return { kind: "workspace", at: 0 };
    wi = clamp(layout.cur + i, 0, layout.workspaces.length - 1);
  }
  const ws = layout.workspaces[wi];
  const y = p.y - wsTop(wi);
  const sx = p.x + ws.viewX;
  for (const [ci, col] of ws.columns.entries()) {
    const cx = colX(ws, ci);
    const w = colWidth(col);
    if (sx < cx - g / 2) return { kind: "column", ws, before: col };
    if (sx > cx + w + g / 2) continue;
    const fx = (sx - cx) / w;
    if (fx < 0.2) return { kind: "column", ws, before: col };
    if (fx > 0.8) return { kind: "column", ws, before: ws.columns[ci + 1] ?? null };
    if (col.tabbed) return { kind: "tab", ws, col, afterKey: col.items[col.active] };
    const hs = itemHeights(col);
    let top = g;
    for (const [ii, key] of col.items.entries()) {
      if (y < top + hs[ii] + g / 2 || ii === col.items.length - 1) {
        const fy = (y - top) / hs[ii];
        if (fy < 0.3) return { kind: "into", ws, col, beforeKey: key };

// Puts `key` (out of the layout) where `target` says, and focuses it. With no target,
// back where it was (`held`, from lift()). False if it went nowhere.
function place(key, target, { width = { p: CONFIG.defaultColumnWidth }, held = null } = {}) {
  const back = () => (held ? putBack(key, held) : false);
  if (!target) return back();
  if (target.kind === "workspace") {
    const ws = newWorkspace();
    ws.columns.push({ ...newColumn(key), width });
    layout.workspaces.splice(target.at, 0, ws);
    layout.cur = target.at;
    ensureVisible(ws);
    return true;
  }
  const ws = target.ws;
  const wi = layout.workspaces.indexOf(ws);
  if (wi < 0) return back();
  let ci;
  if (target.kind === "column") {
    ci = target.before ? ws.columns.indexOf(target.before) : -1;
    if (ci < 0) ci = ws.columns.length;
    ws.columns.splice(ci, 0, { ...newColumn(key), width });
  } else {
    const col = target.col;
    ci = ws.columns.indexOf(col);
    if (ci < 0) return back();

      ii = col.items.indexOf(target.afterKey) + 1 || col.items.length;
    } else {
      ii = target.beforeKey ? col.items.indexOf(target.beforeKey) : -1;

  if (held.float) held.ws.floating.splice(Math.min(held.fi, held.ws.floating.length), 0, held.float);

// niri's insert hint: where the moved window goes, in the world (so the overview zooms it).
function hintRect(t) {

  }
  const ws = t.ws;

  const ci = ws.columns.indexOf(t.col);

  const hs = itemHeights(t.col);
  const ii = t.beforeKey ? t.col.items.indexOf(t.beforeKey) : t.col.items.length;

// The view nearest `target` that starts or ends at a column's edge (centers a
// column, with center-focused-column "always"); the focus stays if its column is
// in view, else goes to that column.
function snapView(ws, target) {

    const x = colX(ws, ci);

let pan = null;

// The wheel with Super (in the overview, without): a mouse wheel's notch is

//   vertical: workspace; +Ctrl: move the column there; +Shift: column; +Ctrl+Shift: move the column

// ---------------------------------------------------------------- launcher

      r.unshift(item.app.id);
      recent.splice(0, recent.length, ...r.slice(0, 8));
      try { localStorage.setItem("niri-shell.recent", JSON.stringify(recent)); } catch {}
      await shell.launchApp(TAG, item.app.id);
    } else if (item.kind === "tab") {
      await shell.createTab(TAG, item.label);
    } else if (item.kind === "cmd") {
      await shell.launch(TAG, ["sh", "-c", item.label], { show: true });
    } else if (item.kind === "agent") {
      const setup = await fetch(`${helper}/v1/thread-setup?thread=${encodeURIComponent(TAG)}`).then((r) => r.json());
      const mcp = JSON.stringify({ mcpServers: { plutonium: { type: "stdio", ...setup.mcpServer } } });
      await shell.launch(TAG, [...CONFIG.terminal, "-T", "agent", "-e", "claude", "--mcp-config", mcp], { show: true });
    }
  } catch (e) {
    notice(`${item.label}: ${e.message}`);
  }
}
$("launcher-input").addEventListener("input", () => { launcherSelected = 0; renderLauncher(); });
$("launcher-input").addEventListener("keydown", (e) => {
  if (e.metaKey) return;
  if (e.key === "Escape") { e.preventDefault(); closeModal(); }
  else if (e.key === "ArrowDown" || (e.ctrlKey && e.key === "n")) { e.preventDefault(); launcherSelected++; renderLauncher(); }
  else if (e.key === "ArrowUp" || (e.ctrlKey && e.key === "p")) { e.preventDefault(); launcherSelected = Math.max(0, launcherSelected - 1); renderLauncher(); }
  else if (e.key === "Enter") { e.preventDefault(); const item = launcherItems[launcherSelected]; if (item) runLauncherItem(item); }
});
addEventListener("pointerdown", (e) => {
  if (modal && !$(modal).contains(e.target)) closeModal();
}, true);

// ---------------------------------------------------------------- hotkey overlay
const pretty = (combo) => combo.split("+").map((p) => ({
  Super: "Super", Ctrl: "Ctrl", Shift: "Shift", Alt: "Alt", ArrowLeft: "←", ArrowRight: "→", ArrowUp: "↑", ArrowDown: "↓",
  Slash: "/", Comma: ",", Period: ".", Minus: "-", Equal: "=", BracketLeft: "[", BracketRight: "]", PageDown: "Page Down", PageUp: "Page Up",
})[p] ?? p.replace(/^Key|^Digit/, "")).join(" + ");
function showHotkeys() {
  const box = $("hotkeys");
  const rows = binds.filter((b) => b.hotkey).map((b) => {
    const tr = document.createElement("tr");
    const keys = document.createElement("td");
    keys.append(Object.assign(document.createElement("kbd"), { textContent: pretty(b.keys[0]) }));
    tr.append(keys, Object.assign(document.createElement("td"), { textContent: b.label }));
    return tr;
  });
  const extra = [
    ["Super + 1…9", "Focus Workspace"], ["Super + drag", "Move Window (a column, into one, a tab)"],
    ["Super + right-drag", "Resize Window"], ["Super + middle-drag", "Drag the View"],
    ["Super + two-finger scroll", "Swipe Columns and Workspaces"],
    ["Super + F", "Fullscreen (browser)"], ["Super + Tab", "Shells and windows (browser)"],
  ].map(([k, label]) => {
    const tr = document.createElement("tr");
    const keys = document.createElement("td");
    keys.append(Object.assign(document.createElement("kbd"), { textContent: k }));
    tr.append(keys, Object.assign(document.createElement("td"), { textContent: label }));
    return tr;
  });
  const table = document.createElement("table");
  table.append(...rows, ...extra);
  box.replaceChildren(Object.assign(document.createElement("h2"), { textContent: "Important Hotkeys" }), table);
  closeModal();
  openModal("hotkeys");
  box.hidden = false;
}
$("hotkeys").addEventListener("click", closeModal);

let noticeTimer = null;
function notice(text) {
  const el = $("notice");
  el.textContent = text;
  el.classList.add("shown");
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => el.classList.remove("shown"), 4000);
}

// ---------------------------------------------------------------- persistence
function save() {
  try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(layout)); } catch {}
}
function restore() {
  try {
    const saved = JSON.parse(localStorage.getItem(LAYOUT_KEY));
    if (saved?.workspaces?.length) layout = saved;
  } catch {}
}

// ---------------------------------------------------------------- taking items
// An agent, the browser's overlay or a drop asked to show a window here: bring it in
// if it's another shell's (or on another output), then go to it.
function takeWindow(window) {
  const key = `w:${window.id}`;
  // The hotkeys overlay (shown at startup) would keep the keyboard from it.
  if (modal === "hotkeys") closeModal();
  const own = ownOutput();
  if (!manages(window) || (own && !tagsOf(window).includes(own))) {
    adopted.add(window.id);
    claiming.add(key);
    if (shell.tagsAvailable) {
      const { add, remove } = outputTags(tagsOf(window));
      shell.tagWindow(window.id, add, remove).catch(() => {});
    }
    addItem(key);
  }
  overview = false;
  focusItem(key);
  refocus();
  commit();
  return true;
}

function takeTab(tab) {
  const key = `t:${tab.id}`;
  if (modal === "hotkeys") closeModal();
  const own = ownOutput();
  if ((!tab.tags.includes(TAG) || (own && !tab.tags.includes(own))) && shell.tagsAvailable) {
    claiming.add(key);
    const { add, remove } = outputTags(tab.tags);
    shell.tagTab(tab.id, add, remove).catch(() => {});
  }
  if (!find(key)) addItem(key);
  overview = false;
  focusItem(key);
  refocus();
  commit();
  return true;
}

// ---------------------------------------------------------------- start
addEventListener("resize", () => { for (const ws of layout.workspaces) ensureVisible(ws); render(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refocus(); });
try {
  const { connect } = await import(`${helper}/v1/shell.js`);
  shell = connect({
    // An agent or the browser's overlay asked to show a window: bring it in if
    // it's another shell's, then go to it.
    onFocus: (window) => takeWindow(window),
    // A link the page opened (Ctrl+click, target=_blank) is a tile here.
    onOpenTab: () => TAG,
    onFocusTab: (tab) => takeTab(tab),
  });
  // The bar, and in it the status indicators over the desktop services
  // (shell.json's "uses"), each its own module.
  try {
    const bar = (await import("./bar.js")).mountBar();
    barHeight = bar.height;
    // Each in a slot made now, so they keep this order however they load.
    const indicator = (file, container = document.body) => {
      const slot = document.createElement("span");
      slot.style.display = "contents";
      container.append(slot);
      import(file).then((module) => module.default(shell, slot)).catch(console.error);
    };
    // The minimap first: it needs the layout (and comes before the others).
    try {
      const { mountMinimap } = await import("./minimap.js");
      const slot = document.createElement("span");
      slot.style.display = "contents";
      bar.left.append(slot);
      minimap = mountMinimap(shell, slot, {
        workspaces: () => layout.workspaces.map((ws, wi) => ({
          id: ws.id, index: wi, current: wi === layout.cur, empty: isEmpty(ws), viewX: Math.round(ws.viewX),
          columns: ws.columns.map((col, ci) => ({ x: colX(ws, ci), w: colWidth(col), tabbed: col.tabbed, active: col.active, items: [...col.items] })),
          floating: ws.floating.map((f) => f.key),
        })),
        focused: () => focusedKey(),
        screen: () => ({ width: W(), height: H(), gap: g }),
        focus: (key) => { overview = false; updateShortcuts(); focusItem(key); refocus(); commit(); },
        focusWorkspace: (i) => { actions.focusWorkspace(i); commit(); },
        focusColumn: (d) => { actions.focusColumn(d); commit(); },
      });
    } catch (error) {
      console.error(error);
    }
    indicator("./media.js", bar.left);
    indicator("./network.js", bar.right);
    indicator("./bluetooth.js", bar.right);
    indicator("./audio.js", bar.right);
    indicator("./brightness.js", bar.right);
    indicator("./battery.js", bar.right);
    indicator("./power.js", bar.right);
    indicator("./osd.js");
  } catch (error) {
    console.error(error);
  }
  // An item dropped here from another shell (or display) joins this output.
  addEventListener("dragover", (e) => {
    if (shell.itemFromDrop(e)) e.preventDefault();
  });
  addEventListener("drop", (e) => {
    const item = shell.itemFromDrop(e);
    if (!item) return;
    e.preventDefault();
    const target = dropTarget(e.clientX, e.clientY);
    const window = item.windowId && shell.windows.get(item.windowId);
    const tab = item.tabId && shell.tabs.get(item.tabId);
    if (window) takeWindow(window);
    if (tab) takeTab(tab);
    // Where it was dropped, as a window moved here would go.
    const key = window ? `w:${window.id}` : tab ? `t:${tab.id}` : null;
    if (key && target && find(key)) {
      detach(key);
      if (!place(key, target)) addItem(key);
      focusItem(key);
      refocus();
      commit();
    }
  });
  shell.addEventListener("change", () => {
    reconcile();
    // A click into a browser tab moved the keyboard there.
    for (const [key, tile] of tiles) {
      if (tile.kind === "t" && shell.tabs.get(tile.id)?.focused && focusedKey() !== key) onItemFocused(key);
    }
    render();
  });
  await shell.ready;
  shell.setGroups([{ tag: TAG, label: "niri" }]);
  updateShortcuts();
  restore();
  ready = true;
  reconcile();
} catch (error) {
  console.error(error);
  notice(`helper unreachable (${helper})`);
}
ready = true;
normalize();
render();
requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove("noanim")));
if (CONFIG.hotkeyOverlayAtStartup && shell?.available) showHotkeys();
</script>
</body>
</html>
